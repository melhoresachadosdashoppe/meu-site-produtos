<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>
    Todos os Produtos dos Videos
</title>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<style>

:root{

    --orange:#f4511e;
    --orange2:#ff7a00;

    --bg:#fff8f3;

    --text:#222;

}


*{

    box-sizing:border-box;

}


body{

    margin:0;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        var(--bg);

    color:
        var(--text);

}


/* =========================
   CABEÇALHO
========================= */


header{

    background:
        linear-gradient(
            135deg,
            var(--orange),
            var(--orange2)
        );

    color:white;

    padding:
        28px 16px;

    box-shadow:
        0 4px 20px #0002;

}


.site-title{

    text-align:center;

    cursor:pointer;

    user-select:none;

}


.site-title h1{

    margin:0;

    font-size:
        clamp(
            24px,
            6vw,
            38px
        );

    font-weight:950;

    line-height:1.1;

}


.site-title p{

    max-width:850px;

    margin:
        12px auto 0;

    font-size:
        clamp(
            12px,
            2.5vw,
            15px
        );

    line-height:1.45;

    font-weight:600;

}


/* =========================
   MAIN
========================= */


main{

    max-width:1100px;

    margin:auto;

    padding:
        25px 16px 60px;

}


.hidden{

    display:none !important;

}


/* =========================
   PESQUISA
========================= */


.search-area{

    max-width:700px;

    margin:
        0 auto 25px;

    position:relative;

}


.search{

    width:100%;

    height:54px;

    padding:
        0 48px;

    border:
        2px solid #eee;

    border-radius:16px;

    background:white;

    outline:none;

    font-size:16px;

    box-shadow:
        0 5px 20px #0000000c;

}


.search:focus{

    border-color:
        var(--orange);

}


.search-icon{

    position:absolute;

    left:17px;

    top:50%;

    transform:
        translateY(-50%);

    font-size:20px;

}


.clear{

    position:absolute;

    right:10px;

    top:50%;

    transform:
        translateY(-50%);

    width:34px;

    height:34px;

    border:0;

    border-radius:50%;

    background:#eee;

    cursor:pointer;

    display:none;

}


/* =========================
   PRODUTOS
========================= */


.grid{

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(
                220px,
                1fr
            )
        );

    gap:16px;

}


.card{

    background:white;

    border-radius:18px;

    overflow:hidden;

    border:
        1px solid #eee;

    box-shadow:
        0 5px 20px #0000000c;

    cursor:pointer;

    transition:.2s;

}


.card:hover{

    transform:
        translateY(-4px);

}


.product-image{

    height:230px;

    padding:8px;

    display:flex;

    align-items:center;

    justify-content:center;

    background:white;

}


.product-image img{

    width:100%;

    height:100%;

    object-fit:contain;

}


.product-info{

    padding:15px;

}


.product-name{

    font-weight:800;

    font-size:15px;

    line-height:1.4;

}


/* =========================
   PAINEL
========================= */


.panel{

    max-width:700px;

    margin:auto;

    padding:25px;

    background:white;

    border-radius:20px;

    box-shadow:
        0 8px 30px #0000000d;

}


.panel h2{

    margin-top:0;

}


label{

    display:block;

    margin:
        17px 0 7px;

    font-size:14px;

    font-weight:800;

}


input{

    width:100%;

    padding:14px;

    border:
        1px solid #ddd;

    border-radius:12px;

    outline:none;

    font-size:15px;

}


input:focus{

    border-color:
        var(--orange);

}


/* =========================
   BOTÕES
========================= */


.btn{

    margin-top:18px;

    border:0;

    padding:
        13px 20px;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            var(--orange),
            var(--orange2)
        );

    color:white;

    font-weight:900;

    cursor:pointer;

}


.btn:hover{

    opacity:.92;

}


.back{

    border:
        1px solid #ffc8b4;

    background:white;

    color:
        var(--orange);

    padding:
        11px 16px;

    border-radius:12px;

    font-weight:900;

    cursor:pointer;

    margin-bottom:20px;

}


.back:hover{

    background:#fff2eb;

}


/* =========================
   VISITANTES
========================= */


.visitor-panel{

    max-width:700px;

    margin:
        0 auto 25px;

    padding:22px;

    background:white;

    border:
        1px solid #ffd8ca;

    border-radius:18px;

    text-align:center;

    box-shadow:
        0 7px 25px #0000000b;

}


.visitor-number{

    font-size:44px;

    line-height:1;

    font-weight:950;

    color:
        var(--orange);

}


.visitor-text{

    margin-top:8px;

    color:#666;

    font-size:14px;

    font-weight:700;

}


/* =========================
   UPLOAD
========================= */


.upload{

    display:block;

    padding:25px;

    text-align:center;

    border:
        2px dashed #ffc4ad;

    border-radius:14px;

    color:#777;

    cursor:pointer;

}


.upload strong{

    display:block;

    color:
        var(--orange);

    margin-bottom:6px;

}


/* =========================
   ADMIN
========================= */


.admin-products{

    max-width:700px;

    margin:
        30px auto;

}


.admin-item{

    display:flex;

    align-items:center;

    gap:12px;

    background:white;

    padding:12px;

    border-radius:14px;

    margin-bottom:10px;

    box-shadow:
        0 4px 15px #00000008;

}


.admin-thumb{

    width:60px;

    height:60px;

    object-fit:contain;

    border-radius:10px;

    background:#f5f5f5;

}


.admin-name{

    flex:1;

    font-weight:800;

}


.delete{

    border:0;

    background:#fff0ed;

    color:#d32f2f;

    padding:
        9px 12px;

    border-radius:10px;

    font-weight:800;

    cursor:pointer;

}


.error{

    color:#d32f2f;

    font-size:13px;

    margin-top:10px;

}


.empty{

    grid-column:1/-1;

    text-align:center;

    padding:35px;

    color:#777;

}


/* =========================
   RESPONSIVO
========================= */


@media(max-width:600px){

    .grid{

        grid-template-columns:
            repeat(
                2,
                minmax(0,1fr)
            );

        gap:10px;

    }


    .product-image{

        height:180px;

    }


    .product-info{

        padding:11px;

    }


    .product-name{

        font-size:13px;

    }


    .site-title h1{

        font-size:23px;

    }

}

</style>

</head>


<body>


<!-- =========================
     CABEÇALHO
========================= -->


<header>

    <div
        class="site-title"
        id="siteTitle"
    >

        <h1>
            TODOS OS PRODUTOS DOS VIDEOS
        </h1>


        <p>
            lembrando que cada produto desse é oficialmente da shoppe ao clicar ira ser direcionado para o produto na shoppe
        </p>

    </div>

</header>



<!-- =========================
     ABA PRINCIPAL
========================= -->


<main
    id="homePage"
>


    <div
        class="search-area"
    >

        <span
            class="search-icon"
        >
            🔎
        </span>


        <input
            class="search"
            id="search"
            type="search"
            placeholder="Pesquisar produto..."
        >


        <button
            class="clear"
            id="clearSearch"
        >
            ×
        </button>

    </div>


    <div
        class="grid"
        id="products"
    ></div>


</main>



<!-- =========================
     ABA SENHA
========================= -->


<main
    id="passwordPage"
    class="hidden"
>


    <div
        class="panel"
    >

        <h2>
            ABA SENHA
        </h2>


        <label>
            Digite a senha:
        </label>


        <input
            id="password"
            type="password"
            placeholder="Digite a senha"
        >


        <button
            class="btn"
            id="confirm"
        >
            Confirma
        </button>


        <div
            class="error"
            id="passwordError"
        ></div>

    </div>


</main>



<!-- =========================
     ABA DONO
========================= -->


<main
    id="ownerPage"
    class="hidden"
>


    <button
        class="back"
        id="backButton"
    >

        ← Voltar para a ABA principal

    </button>



    <!-- TOTAL DE VISITANTES -->


    <div
        class="visitor-panel"
    >

        <div
            class="visitor-number"
            id="totalVisitors"
        >
            0
        </div>


        <div
            class="visitor-text"
        >

            pessoas entraram no site ao total

        </div>

    </div>



    <!-- FORMULÁRIO -->


    <div
        class="panel"
    >

        <h2>
            adicione um produto
        </h2>


        <label>
            Imagem:
        </label>


        <label
            class="upload"
            for="image"
        >

            <strong>
                📷 Escolher imagem
            </strong>

            Clique aqui para escolher
            uma foto da galeria

        </label>


        <input
            id="image"
            type="file"
            accept="image/*"
            class="hidden"
        >


        <div
            id="preview"
        ></div>


        <label>
            Nome:
        </label>


        <input
            id="name"
            type="text"
            placeholder="Nome do produto"
        >


        <label>
            Link:
        </label>


        <input
            id="link"
            type="url"
            placeholder="https://..."
        >


        <button
            class="btn"
            id="add"
        >

            Adicionar produto

        </button>


        <div
            class="error"
            id="formError"
        ></div>

    </div>



    <!-- PRODUTOS DO DONO -->


    <section
        class="admin-products"
    >

        <h2>
            TODOS OS PRODUTOS
        </h2>


        <div
            id="adminList"
        ></div>

    </section>


</main>



<script>


/* =====================================================
   SUPABASE
===================================================== */


/*
    COLE AQUI SUA PUBLISHABLE KEY
*/

const SUPABASE_URL =
    "https://nndwzyikpibdxxzwghzm.supabase.co";


const SUPABASE_KEY =
    "COLE_SUA_PUBLISHABLE_KEY_AQUI";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );



/* =====================================================
   ELEMENTOS
===================================================== */


const home =
    document.getElementById(
        "homePage"
    );


const passwordPage =
    document.getElementById(
        "passwordPage"
    );


const owner =
    document.getElementById(
        "ownerPage"
    );


const productsBox =
    document.getElementById(
        "products"
    );



/* =====================================================
   NAVEGAÇÃO
===================================================== */


function show(page){

    home.classList.add(
        "hidden"
    );

    passwordPage.classList.add(
        "hidden"
    );

    owner.classList.add(
        "hidden"
    );


    page.classList.remove(
        "hidden"
    );

}



/* =====================================================
   5 CLIQUES NO TÍTULO
===================================================== */


let clicks = 0;

let clickTimer;


document
    .getElementById(
        "siteTitle"
    )
    .addEventListener(
        "click",
        () => {

            clicks++;


            clearTimeout(
                clickTimer
            );


            clickTimer =
                setTimeout(
                    () => {

                        clicks = 0;

                    },
                    1500
                );


            if(clicks >= 5){

                clicks = 0;


                show(
                    passwordPage
                );


                document
                    .getElementById(
                        "password"
                    )
                    .focus();

            }

        }
    );



/* =====================================================
   SENHA
===================================================== */


document
    .getElementById(
        "confirm"
    )
    .addEventListener(
        "click",
        () => {

            const password =
                document
                    .getElementById(
                        "password"
                    )
                    .value;


            if(
                password ===
                "000111"
            ){

                document
                    .getElementById(
                        "passwordError"
                    )
                    .textContent = "";


                show(
                    owner
                );


                renderAdmin();

                loadVisitorTotal();

            }

            else{

                document
                    .getElementById(
                        "passwordError"
                    )
                    .textContent =
                    "Senha incorreta.";

            }

        }
    );



/* =====================================================
   VOLTAR
===================================================== */


document
    .getElementById(
        "backButton"
    )
    .addEventListener(
        "click",
        () => {

            show(
                home
            );

        }
    );



/* =====================================================
   CARREGAR PRODUTOS DO SUPABASE
===================================================== */


async function loadProducts(){

    const {
        data,
        error
    } = await supabaseClient

        .from(
            "produtos"
        )

        .select(
            "*"
        )

        .order(
            "criado_em",
            {
                ascending:false
            }
        );


    if(error){

        console.error(
            error
        );


        productsBox.innerHTML = `

            <div class="empty">

                Erro ao carregar os produtos.

                <br><br>

                Verifique a configuração
                do Supabase.

            </div>

        `;

        return;

    }


    renderProducts(
        data || []
    );

}



/* =====================================================
   MOSTRAR PRODUTOS
===================================================== */


function renderProducts(
    products
){

    productsBox.innerHTML = "";


    const search =
        document
            .getElementById(
                "search"
            )
            .value
            .trim()
            .toLowerCase();


    const filtered =
        products.filter(
            product =>

                String(
                    product.nome || ""
                )
                .toLowerCase()
                .includes(
                    search
                )

        );


    if(
        filtered.length === 0
    ){

        productsBox.innerHTML = `

            <div class="empty">

                🔎

                <br><br>

                Nenhum produto encontrado.

            </div>

        `;

        return;

    }



    filtered.forEach(
        product => {

            const card =
                document.createElement(
                    "article"
                );


            card.className =
                "card";


            card.innerHTML = `

                <div
                    class="product-image"
                >

                    ${
                        product.imagem

                        ?

                        `<img
                            src="${product.imagem}"
                            alt="${escapeHtml(product.nome)}"
                        >`

                        :

                        `<span
                            style="
                                font-size:55px
                            "
                        >
                            🛍️
                        </span>`
                    }

                </div>


                <div
                    class="product-info"
                >

                    <div
                        class="product-name"
                    >

                        ${escapeHtml(
                            product.nome
                        )}

                    </div>

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    if(
                        product.link
                    ){

                        window.open(
                            product.link,
                            "_blank"
                        );

                    }

                }
            );


            productsBox.appendChild(
                card
            );

        }
    );

}



/* =====================================================
   PESQUISA
===================================================== */


document
    .getElementById(
        "search"
    )
    .addEventListener(
        "input",
        () => {

            loadProducts();


            const value =
                document
                    .getElementById(
                        "search"
                    )
                    .value;


            document
                .getElementById(
                    "clearSearch"
                )
                .style.display =
                value
                    ? "block"
                    : "none";

        }
    );



document
    .getElementById(
        "clearSearch"
    )
    .addEventListener(
        "click",
        () => {

            document
                .getElementById(
                    "search"
                )
                .value = "";


            document
                .getElementById(
                    "clearSearch"
                )
                .style.display =
                "none";


            loadProducts();

        }
    );



/* =====================================================
   ESCOLHER IMAGEM
===================================================== */


let selectedImage = "";


document
    .getElementById(
        "image"
    )
    .addEventListener(
        "change",
        event => {

            const file =
                event.target.files[0];


            if(!file)
                return;


            const reader =
                new FileReader();


            reader.onload =
                () => {

                    selectedImage =
                        reader.result;


                    document
                        .getElementById(
                            "preview"
                        )
                        .innerHTML = `

                            <img
                                src="${selectedImage}"
                                style="
                                    width:100%;
                                    max-height:220px;
                                    object-fit:contain;
                                    margin-top:12px;
                                    border-radius:14px;
                                "
                            >

                        `;

                };


            reader.readAsDataURL(
                file
            );

        }
    );



/* =====================================================
   ADICIONAR PRODUTO
===================================================== */


document
    .getElementById(
        "add"
    )
    .addEventListener(
        "click",
        async () => {

            const name =
                document
                    .getElementById(
                        "name"
                    )
                    .value
                    .trim();


            const link =
                document
                    .getElementById(
                        "link"
                    )
                    .value
                    .trim();


            const errorBox =
                document
                    .getElementById(
                        "formError"
                    );


            if(
                !name ||
                !link
            ){

                errorBox.textContent =
                    "Preencha o nome e o link.";

                return;

            }


            if(
                !selectedImage
            ){

                errorBox.textContent =
                    "Escolha uma imagem.";

                return;

            }


            errorBox.textContent =
                "Adicionando...";


            /*
                OBSERVAÇÃO:

                Nesta primeira versão,
                a imagem é enviada como
                texto para o banco.

                Para uma versão definitiva,
                vamos colocar as imagens
                no Supabase Storage.
            */


            const {
                error
            } =
                await supabaseClient

                    .from(
                        "produtos"
                    )

                    .insert({

                        nome:name,

                        imagem:selectedImage,

                        link:link

                    });


            if(error){

                console.error(
                    error
                );


                errorBox.textContent =
                    "Erro ao adicionar produto.";

                return;

            }


            document
                .getElementById(
                    "name"
                )
                .value = "";


            document
                .getElementById(
                    "link"
                )
                .value = "";


            document
                .getElementById(
                    "image"
                )
                .value = "";


            document
                .getElementById(
                    "preview"
                )
                .innerHTML = "";


            selectedImage = "";


            errorBox.textContent =
                "Produto adicionado!";


            renderAdmin();

        }
    );



/* =====================================================
   LISTA DA ABA DONO
===================================================== */


async function renderAdmin(){

    const list =
        document
            .getElementById(
                "adminList"
            );


    list.innerHTML =
        "Carregando...";


    const {
        data,
        error
    } =
        await supabaseClient

            .from(
                "produtos"
            )

            .select(
                "*"
            )

            .order(
                "criado_em",
                {
                    ascending:false
                }
            );


    if(error){

        list.innerHTML =
            "Erro ao carregar produtos.";

        return;

    }


    list.innerHTML = "";


    if(
        !data ||
        data.length === 0
    ){

        list.innerHTML = `

            <div class="empty">

                Nenhum produto cadastrado.

            </div>

        `;

        return;

    }


    data.forEach(
        product => {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "admin-item";


            item.innerHTML = `

                ${
                    product.imagem

                    ?

                    `<img
                        class="admin-thumb"
                        src="${product.imagem}"
                    >`

                    :

                    `<div
                        class="admin-thumb"
                        style="
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            font-size:25px;
                        "
                    >
                        🛍️
                    </div>`
                }


                <div
                    class="admin-name"
                >

                    ${escapeHtml(
                        product.nome
                    )}

                </div>


                <button
                    class="delete"
                >

                    Deletar

                </button>

            `;


            item
                .querySelector(
                    ".delete"
                )
                .addEventListener(
                    "click",
                    () => {

                        deleteProduct(
                            product.id
                        );

                    }
                );


            list.appendChild(
                item
            );

        }
    );

}



/* =====================================================
   DELETAR PRODUTO
===================================================== */


async function deleteProduct(
    id
){

    if(
        !confirm(
            "Deseja deletar este produto?"
        )
    ){

        return;

    }


    const {
        error
    } =
        await supabaseClient

            .from(
                "produtos"
            )

            .delete()

            .eq(
                "id",
                id
            );


    if(error){

        alert(
            "Não foi possível deletar."
        );

        console.error(
            error
        );

        return;

    }


    loadProducts();

    renderAdmin();

}



/* =====================================================
   REALTIME
===================================================== */


supabaseClient

    .channel(
        "produtos-em-tempo-real"
    )

    .on(

        "postgres_changes",

        {
            event:"*",

            schema:"public",

            table:"produtos"

        },

        () => {

            loadProducts();

            renderAdmin();

        }

    )

    .subscribe();



/* =====================================================
   CONTADOR DE VISITANTES
===================================================== */


/*
    Para o contador total funcionar
    entre TODOS os aparelhos,
    precisamos de uma tabela própria.

    Crie essa tabela no Supabase
    com o SQL que vou passar abaixo.
*/


async function registerVisit(){

    const {
        data,
        error
    } =
        await supabaseClient

            .from(
                "visitas"
            )

            .insert({

                visitante:
                    crypto.randomUUID()

            });


    if(error){

        console.error(
            "Erro visitante:",
            error
        );

    }

}



/* =====================================================
   CARREGAR TOTAL DE VISITANTES
===================================================== */


async function loadVisitorTotal(){

    const {
        count,
        error
    } =
        await supabaseClient

            .from(
                "visitas"
            )

            .select(
                "*",
                {
                    count:"exact",
                    head:true
                }
            );


    if(error){

        console.error(
            error
        );

        return;

    }


    document
        .getElementById(
            "totalVisitors"
        )
        .textContent =
        Number(
            count || 0
        ).toLocaleString(
            "pt-BR"
        );

}



/* =====================================================
   SEGURANÇA DE TEXTO
===================================================== */


function escapeHtml(
    value
){

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}
