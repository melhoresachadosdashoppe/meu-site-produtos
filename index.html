<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Todos os Produtos dos Videos</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#fff7f2;
    color:#222;
}

header{
    background:linear-gradient(135deg,#ee4d2d,#ff7300);
    color:white;
    padding:28px 15px;
    box-shadow:0 4px 20px #0002;
}

.title{
    text-align:center;
    cursor:pointer;
    user-select:none;
}

.title h1{
    margin:0;
    font-size:clamp(25px,6vw,40px);
    font-weight:900;
}

.title p{
    max-width:850px;
    margin:12px auto 0;
    font-size:14px;
    font-weight:bold;
    line-height:1.5;
}

main{
    max-width:1100px;
    margin:auto;
    padding:25px 15px 60px;
}

.hidden{
    display:none!important;
}

.search-box{
    max-width:700px;
    margin:0 auto 25px;
}

.search-box input{
    width:100%;
    height:52px;
    border:2px solid #eee;
    border-radius:15px;
    padding:0 18px;
    font-size:16px;
    outline:none;
    background:white;
}

.search-box input:focus{
    border-color:#ee4d2d;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:16px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 5px 20px #00000012;
    cursor:pointer;
    transition:.2s;
}

.card:hover{
    transform:translateY(-4px);
}

.card-image{
    height:230px;
    padding:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:white;
}

.card-image img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.card-name{
    padding:15px;
    font-size:15px;
    font-weight:800;
}

.panel{
    max-width:700px;
    margin:auto;
    padding:25px;
    background:white;
    border-radius:20px;
    box-shadow:0 8px 30px #00000010;
}

.panel h2{
    margin-top:0;
}

label{
    display:block;
    margin:17px 0 7px;
    font-size:14px;
    font-weight:bold;
}

input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
}

button{
    cursor:pointer;
}

.btn{
    margin-top:18px;
    border:0;
    padding:14px 20px;
    border-radius:12px;
    background:linear-gradient(135deg,#ee4d2d,#ff7300);
    color:white;
    font-weight:900;
}

.back{
    border:1px solid #ffc8b4;
    background:white;
    color:#ee4d2d;
    padding:11px 16px;
    border-radius:12px;
    font-weight:900;
    margin-bottom:20px;
}

.upload{
    display:block;
    padding:25px;
    text-align:center;
    border:2px dashed #ffc2ad;
    border-radius:14px;
    color:#777;
    cursor:pointer;
}

.upload strong{
    display:block;
    color:#ee4d2d;
    margin-bottom:6px;
}

.preview{
    margin-top:12px;
    text-align:center;
}

.preview img{
    width:100%;
    max-height:230px;
    object-fit:contain;
    border-radius:14px;
}

.visitors{
    max-width:700px;
    margin:0 auto 25px;
    padding:22px;
    background:white;
    border-radius:18px;
    text-align:center;
    box-shadow:0 7px 25px #0000000d;
}

.visitor-number{
    font-size:45px;
    font-weight:900;
    color:#ee4d2d;
}

.visitor-text{
    color:#666;
    font-size:14px;
    font-weight:bold;
}

.admin-list{
    max-width:700px;
    margin:30px auto;
}

.admin-item{
    display:flex;
    align-items:center;
    gap:12px;
    background:white;
    padding:12px;
    border-radius:14px;
    margin-bottom:10px;
    box-shadow:0 4px 15px #00000008;
}

.admin-thumb{
    width:60px;
    height:60px;
    object-fit:contain;
    border-radius:10px;
    background:#f5f5f5;
}

.admin-name{
    flex:1;
    font-weight:bold;
}

.delete{
    border:0;
    background:#fff0ed;
    color:#d32f2f;
    padding:9px 12px;
    border-radius:10px;
    font-weight:bold;
}

.error{
    color:#d32f2f;
    margin-top:10px;
    font-size:14px;
}

.success{
    color:#16803c;
    margin-top:10px;
    font-size:14px;
}

.empty{
    grid-column:1/-1;
    text-align:center;
    padding:40px;
    color:#777;
}

@media(max-width:600px){

    .products{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
    }

    .card-image{
        height:180px;
    }

    .card-name{
        padding:11px;
        font-size:13px;
    }

    .title h1{
        font-size:24px;
    }
}
</style>
</head>

<body>

<header>

    <div class="title" id="siteTitle">

        <h1>
            TODOS OS PRODUTOS DOS VIDEOS
        </h1>

        <p>
            lembrando que cada produto desse é oficialmente da shoppe ao clicar ira ser direcionado para o produto na shoppe
        </p>

    </div>

</header>


<!-- ABA PRINCIPAL -->

<main id="homePage">

    <div class="search-box">

        <input
            id="search"
            type="search"
            placeholder="🔎 Pesquisar produto..."
        >

    </div>

    <div
        class="products"
        id="products"
    ></div>

</main>


<!-- ABA SENHA -->

<main
    id="passwordPage"
    class="hidden"
>

    <div class="panel">

        <h2>ABA SENHA</h2>

        <label>
            Digite a senha:
        </label>

        <input
            id="password"
            type="password"
            placeholder="Digite a senha"
        >

        <button
            class="btn"
            id="confirmPassword"
        >
            Confirma
        </button>

        <div
            class="error"
            id="passwordError"
        ></div>

    </div>

</main>


<!-- ABA DONO -->

<main
    id="ownerPage"
    class="hidden"
>

    <button
        class="back"
        id="backButton"
    >
        ← Voltar para a ABA principal
    </button>


    <div class="visitors">

        <div
            class="visitor-number"
            id="visitorTotal"
        >
            0
        </div>

        <div class="visitor-text">
            pessoas entraram no site ao total
        </div>

    </div>


    <div class="panel">

        <h2>
            adicione um produto
        </h2>


        <label>
            Imagem:
        </label>

        <label
            class="upload"
            for="image"
        >

            <strong>
                📷 Escolher imagem
            </strong>

            Clique aqui para escolher uma foto

        </label>

        <input
            id="image"
            type="file"
            accept="image/*"
            class="hidden"
        >


        <div
            class="preview"
            id="preview"
        ></div>


        <label>
            Nome:
        </label>

        <input
            id="name"
            type="text"
            placeholder="Nome do produto"
        >


        <label>
            Link:
        </label>

        <input
            id="link"
            type="url"
            placeholder="https://..."
        >


        <button
            class="btn"
            id="addProduct"
        >
            Adicionar produto
        </button>


        <div
            id="formMessage"
        ></div>

    </div>


    <section class="admin-list">

        <h2>
            TODOS OS PRODUTOS
        </h2>

        <div id="adminList"></div>

    </section>

</main>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://nndwzyikpibdxxzwghzm.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_Rl3Kbvn6ygWnhKfNBFadEg_-lia60Qg";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   ELEMENTOS
========================================== */

const homePage =
    document.getElementById("homePage");

const passwordPage =
    document.getElementById("passwordPage");

const ownerPage =
    document.getElementById("ownerPage");

const productsBox =
    document.getElementById("products");

const search =
    document.getElementById("search");


/* ==========================================
   NAVEGAÇÃO
========================================== */

function showPage(page){

    homePage.classList.add("hidden");

    passwordPage.classList.add("hidden");

    ownerPage.classList.add("hidden");

    page.classList.remove("hidden");
}


/* ==========================================
   5 CLIQUES NO TÍTULO
========================================== */

let titleClicks = 0;

let clickTimer = null;

document
.getElementById("siteTitle")
.addEventListener("click",function(){

    titleClicks++;

    clearTimeout(clickTimer);

    clickTimer = setTimeout(function(){

        titleClicks = 0;

    },1500);


    if(titleClicks >= 5){

        titleClicks = 0;

        showPage(passwordPage);

        document
        .getElementById("password")
        .focus();

    }

});


/* ==========================================
   SENHA
========================================== */

document
.getElementById("confirmPassword")
.addEventListener("click",function(){

    const password =
        document
        .getElementById("password")
        .value;


    if(password === "000111"){

        document
        .getElementById("passwordError")
        .textContent = "";

        showPage(ownerPage);

        loadAdminProducts();

        loadVisitors();

    }

    else{

        document
        .getElementById("passwordError")
        .textContent =
            "Senha incorreta.";

    }

});


/* ==========================================
   ENTER NA SENHA
========================================== */

document
.getElementById("password")
.addEventListener("keydown",function(event){

    if(event.key === "Enter"){

        document
        .getElementById("confirmPassword")
        .click();

    }

});


/* ==========================================
   VOLTAR
========================================== */

document
.getElementById("backButton")
.addEventListener("click",function(){

    showPage(homePage);

});


/* ==========================================
   ESCAPAR TEXTO
========================================== */

function escapeHTML(text){

    return String(text ?? "")

    .replace(/&/g,"&amp;")

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;")

    .replace(/"/g,"&quot;")

    .replace(/'/g,"&#039;");

}


/* ==========================================
   CARREGAR PRODUTOS
========================================== */

async function loadProducts(){

    const result =
        await supabaseClient
        .from("produtos")
        .select("*")
        .order(
            "criado_em",
            {
                ascending:false
            }
        );


    if(result.error){

        console.error(
            result.error
        );

        productsBox.innerHTML = `

            <div class="empty">

                Erro ao carregar os produtos.

            </div>

        `;

        return;

    }


    renderProducts(
        result.data || []
    );

}


/* ==========================================
   MOSTRAR PRODUTOS
========================================== */

function renderProducts(products){

    const text =
        search.value
        .trim()
        .toLowerCase();


    const filtered =
        products.filter(function(product){

            return String(
                product.nome || ""
            )
            .toLowerCase()
            .includes(text);

        });


    productsBox.innerHTML = "";


    if(filtered.length === 0){

        productsBox.innerHTML = `

            <div class="empty">

                Nenhum produto encontrado.

            </div>

        `;

        return;

    }


    filtered.forEach(function(product){

        const card =
            document.createElement("div");


        card.className = "card";


        const image =
            product.imagem
            ?

            `<img
                src="${product.imagem}"
                alt="${escapeHTML(product.nome)}"
            >`

            :

            `<span style="font-size:55px">
                🛍️
            </span>`;


        card.innerHTML = `

            <div class="card-image">

                ${image}

            </div>

            <div class="card-name">

                ${escapeHTML(product.nome)}

            </div>

        `;


        card.addEventListener(
            "click",
            function(){

                if(product.link){

                    window.open(
                        product.link,
                        "_blank"
                    );

                }

            }
        );


        productsBox.appendChild(card);

    });

}


/* ==========================================
   PESQUISA
========================================== */

search.addEventListener(
    "input",
    function(){

        loadProducts();

    }
);


/* ==========================================
   PREVIEW DA IMAGEM
========================================== */

let selectedImage = "";


document
.getElementById("image")
.addEventListener("change",function(event){

    const file =
        event.target.files[0];


    if(!file){

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(){

            selectedImage =
                reader.result;


            document
            .getElementById("preview")
            .innerHTML = `

                <img
                    src="${selectedImage}"
                >

            `;

        };


    reader.readAsDataURL(file);

});


/* ==========================================
   ADICIONAR PRODUTO
========================================== */

document
.getElementById("addProduct")
.addEventListener("click",async function(){

    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const link =
        document
        .getElementById("link")
        .value
        .trim();


    const message =
        document
        .getElementById("formMessage");


    if(!name){

        message.className = "error";

        message.textContent =
            "Digite o nome do produto.";

        return;

    }


    if(!link){

        message.className = "error";

        message.textContent =
            "Digite o link do produto.";

        return;

    }


    if(!selectedImage){

        message.className = "error";

        message.textContent =
            "Escolha uma imagem.";

        return;

    }


    message.className = "success";

    message.textContent =
        "Adicionando produto...";


    const result =
        await supabaseClient
        .from("produtos")
        .insert({

            nome:name,

            imagem:selectedImage,

            link:link

        });


    if(result.error){

        console.error(
            result.error
        );

        message.className = "error";

        message.textContent =
            "Erro ao adicionar produto.";

        return;

    }


    document
    .getElementById("name")
    .value = "";


    document
    .getElementById("link")
    .value = "";


    document
    .getElementById("image")
    .value = "";


    document
    .getElementById("preview")
    .innerHTML = "";


    selectedImage = "";


    message.className = "success";

    message.textContent =
        "Produto adicionado com sucesso!";


    loadProducts();

    loadAdminProducts();

});


/* ==========================================
   LISTA DO DONO
========================================== */

async function loadAdminProducts(){

    const list =
        document
        .getElementById("adminList");


    list.innerHTML =
        "Carregando...";


    const result =
        await supabaseClient
        .from("produtos")
        .select("*")
        .order(
            "criado_em",
            {
                ascending:false
            }
        );


    if(result.error){

        list.innerHTML =
            "Erro ao carregar produtos.";

        console.error(
            result.error
        );

        return;

    }


    list.innerHTML = "";


    if(!result.data.length){

        list.innerHTML = `

            <div class="empty">

                Nenhum produto cadastrado.

            </div>

        `;

        return;

    }


    result.data.forEach(function(product){

        const item =
            document.createElement("div");


        item.className =
            "admin-item";


        item.innerHTML = `

            ${
                product.imagem

                ?

                `<img
                    class="admin-thumb"
                    src="${product.imagem}"
                >`

                :

                `<div class="admin-thumb">
                    🛍️
                </div>`
            }


            <div class="admin-name">

                ${escapeHTML(product.nome)}

            </div>


            <button
                class="delete"
            >

                Deletar

            </button>

        `;


        item
        .querySelector(".delete")
        .addEventListener(
            "click",
            function(){

                deleteProduct(
                    product.id
                );

            }
        );


        list.appendChild(item);

    });

}


/* ==========================================
   DELETAR
========================================== */

async function deleteProduct(id){

    const ok =
        confirm(
            "Deseja deletar este produto?"
        );


    if(!ok){

        return;

    }


    const result =
        await supabaseClient
        .from("produtos")
        .delete()
        .eq("id",id);


    if(result.error){

        alert(
            "Erro ao deletar produto."
        );

        console.error(
            result.error
        );

        return;

    }


    loadProducts();

    loadAdminProducts();

}


/* ==========================================
   REALTIME
========================================== */

supabaseClient
.channel("produtos-realtime")
.on(
    "postgres_changes",
    {
        event:"*",
        schema:"public",
        table:"produtos"
    },
    function(){

        loadProducts();

        loadAdminProducts();

    }
)
.subscribe();


/* ==========================================
   VISITANTE
========================================== */

async function registerVisitor(){

    const visitorId =
        localStorage.getItem(
            "visitor_id"
        );


    if(visitorId){

        return;

    }


    const id =
        crypto.randomUUID();


    localStorage.setItem(
        "visitor_id",
        id
    );


    const result =
        await supabaseClient
        .from("visitas")
        .insert({

            visitante_id:id

        });


    if(result.error){

        console.error(
            result.error
        );

    }

}


/* ==========================================
   TOTAL DE VISITANTES
========================================== */

async function loadVisitors(){

    const result =
        await supabaseClient
        .from("visitas")
        .select(
            "*",
            {
                count:"exact",
                head:true
            }
        );


    if(result.error){

        console.error(
            result.error
        );

        return;

    }


    document
    .getElementById(
        "visitorTotal"
    )
    .textContent =
        Number(
            result.count || 0
        ).toLocaleString("pt-BR");

}


/* ==========================================
   ATUALIZAÇÃO DO CONTADOR
========================================== */

setInterval(
    loadVisitors,
    5000
);


/* ==========================================
   INICIAR SITE
========================================== */

registerVisitor();

loadProducts();

</script>

</body>
        </html>
